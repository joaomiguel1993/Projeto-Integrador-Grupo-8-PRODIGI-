services:
  db:
    image: postgres:16
    container_name: prodigi_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES18_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES18_PORT}:5432"
    volumes:
      - prodigi_data:/var/lib/postgresql/data
      - ./backend/SQL/createTables.sql:/docker-entrypoint-initdb.d/createTables.sql
      - ./backend/SQL/populateDB.sql:/docker-entrypoint-initdb.d/populateDB.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: prodigi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db

  app:
    build: .
    container_name: prodigi_app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  ai_service:
    build: ./ia
    container_name: prodigi_ai
    restart: always
    ports:
      - "8001:8001"

volumes:
  prodigi_data: