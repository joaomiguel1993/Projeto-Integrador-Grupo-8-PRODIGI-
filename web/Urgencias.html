<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODIGI - Gestão de Urgências</title>

    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma; background-color: #f4f7f6; display: flex; flex-direction: column; height: 100vh; }

        header { background-color: #005f73; color: white; padding: 15px 20px; display: flex; justify-content: space-between; }
        .logo { font-weight: bold; }

        .container { display: flex; flex: 1; }

        aside { width: 200px; background: white; padding-top: 20px; }
        aside a { display: block; padding: 10px; text-decoration: none; color: #333; }

        main { flex: 1; padding: 20px; }

        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }

        .badge { padding: 5px 10px; border-radius: 20px; color: white; }
        .green { background: green; }
    </style>
</head>

<body>

<header>
    <div class="logo">🏥 PRODIGI</div>
</header>

<div class="container">

    <aside>
        <a href="#">Dashboard</a>
    </aside>

    <main>
        <h1>Utentes</h1>

        <table>
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Sexo</th>
                    <th>Localidade</th>
                    <th>Idade</th>
                </tr>
            </thead>

            <tbody id="tabela-utentes"></tbody>
        </table>
    </main>

</div>

<script>
async function carregarUtentes() {
    try {
        const response = await fetch("http://127.0.0.1:8000/utentes");
        const data = await response.json();

        const tabela = document.getElementById("tabela-utentes");
        tabela.innerHTML = "";

        data.forEach(u => {
            const row = `
                <tr>
                    <td>${u.numutent}</td>
                    <td>${u.sexo}</td>
                    <td>${u.localidade}</td>
                    <td>${u.idadeatual}</td>
                </tr>
            `;
            tabela.innerHTML += row;
        });

    } catch (error) {
        console.error("Erro:", error);
    }
}

carregarUtentes();
</script>

</body>
</html>
